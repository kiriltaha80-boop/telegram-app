<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Pact & Passion</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0C0A10;
      --card-bg: rgba(22, 18, 30, 0.92);
      --card-border: rgba(230, 57, 86, 0.28);
      --accent-color: #E63956;
      --accent-gradient: linear-gradient(135deg, #E63956 0%, #B82342 100%);
      --accent-soft: rgba(230, 57, 86, 0.15);
      --ovulation-color: #E8A0BF;
      --text-main: #F5F3F7;
      --text-muted: #9A91A5;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 10px 10px 80px 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    /* AMBIENT LIGHTS */
    .ambient-glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }
    .glow-1 { top: -50px; left: -50px; background: #E63956; }
    .glow-2 { bottom: 100px; right: -50px; background: #5C1D38; }

    /* SPLASH SCREEN */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 120px;
      transition: opacity 0.8s ease, visibility 0.8s;
      background-color: #5d0309;
      overflow: hidden;
    }

    .splash-bg {
      position: absolute;
      inset: 0;
      background-color: #5d0309;
      background-image: url('https://raw.githubusercontent.com/kiriltaha80-boop/telegram-app/main/IMG_0407.png');
      background-size: 168% auto;
      background-position: center 35%;
      background-repeat: no-repeat;
      z-index: 1;
      border-radius: 0 0 120px 120px;
      -webkit-mask-image: radial-gradient(ellipse 90% 75% at 50% 30%, rgba(0,0,0,1) 40%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0) 95%);
      mask-image: radial-gradient(ellipse 90% 75% at 50% 30%, rgba(0,0,0,1) 40%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0) 95%);
    }

    .splash-bottom-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 100% 60% at 50% 85%, #5d0309 30%, rgba(93, 3, 9, 0.7) 65%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .contract-stage {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 0 20px;
      transform: translateY(-40px);
    }

    .typewriter {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 0 20px rgba(230, 57, 86, 0.9);
    }

    .splash-subtitle {
      font-size: 10px;
      color: var(--accent-color);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 6px;
    }

    .loading-line-bg {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      margin-top: 24px;
      overflow: hidden;
    }

    .loading-line-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-gradient);
      box-shadow: 0 0 12px var(--accent-color);
      animation: fillBar 2.2s ease forwards;
    }

    @keyframes fillBar { to { width: 100%; } }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* DESKTOP HEADER & GRID */
    .desktop-wrapper {
      margin-top: 10px;
      width: 100%;
    }

    .desktop-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14
