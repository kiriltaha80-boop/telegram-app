<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pact & Passion — Церемония Соглашения</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ========================================================
       1. БАЗОВЫЙ ФОН И ПАНЕЛЬ
       ======================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0C0A10;
      color: #F5F3F7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .glow-1 { top: -90px; left: -90px; background: #E63956; }
    .glow-2 { bottom: -70px; right: -70px; background: #680E2B; }

    .demo-dashboard {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
      background: rgba(22, 18, 30, 0.88);
      border: 1px solid rgba(230, 57, 86, 0.35);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 24px rgba(230, 57, 86, 0.2);
      max-width: 340px;
      width: 90%;
      text-align: center;
    }

    .demo-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 0 12px rgba(230, 57, 86, 0.7);
    }

    .demo-status {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #9A91A5;
      text-transform: uppercase;
    }
    .demo-status span {
      color: #10B981;
    }
    .demo-status span.terminated {
      color: #EF4444;
    }

    .btn-test {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #FFFFFF;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .btn-test:active {
      transform: scale(0.96);
    }

    .btn-test-sign {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.45);
    }

    .btn-test-rip {
      background: linear-gradient(135deg, #EF4444 0%, #991B1B 100%);
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.45);
    }

    /* ========================================================
       2. ЦЕРЕМОНИАЛЬНОЕ ОКНО
       ======================================================== */
    .ceremony-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 3, 8, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .ceremony-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .ceremony-container {
      position: relative;
      width: 310px;
      height: 420px;
      perspective: 1100px;
    }

    /* Фаза нарастающего напряжения перед разрывом */
    .ceremony-container.anim-rumble {
      animation: paperRumble 0.3s ease-in-out infinite;
    }

    @keyframes paperRumble {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2.5px, 1.5px) rotate(-0.6deg); }
      50% { transform: translate(2.5px, -1.5px) rotate(0.6deg); }
      75% { transform: translate(-2px, -2px) rotate(-0.4deg); }
    }
