<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pact & Passion</title>
    
    <!-- Open Graph (og:) метатеги для красивого предпросмотра -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kiriltaha80-boop.github.io/telegram-app/">
    <meta property="og:title" content="Pact & Passion">
    <meta property="og:description" content="Эксклюзивное приложение Pact & Passion">
    <meta property="og:image" content="https://kiriltaha80-boop.github.io/telegram-app/cover.jpg">

    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* Базовые стили на весь экран */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Контейнер игры Phaser */
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Эффект затемнения по краям (виньетка) */
        .screen-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Клики проходят сквозь виньетку */
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
            z-index: 5; /* Поверх игры, но под интерфейсом */
        }

        /* Нижнее навигационное меню */
        .nav-menu {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            cursor: pointer;
            color: #b3b3b3;
            font-size: 10px;
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: #ffffff;
        }

        /* Округлый контейнер для иконок в едином стиле */
        .nav-avatar-wrapper {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .nav-item.active .nav-avatar-wrapper {
            background: rgba(255, 59, 48, 0.2);
            border-color: #ff3b30;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        .nav-text {
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Контейнер для Phaser -->
    <div id="game-container"></div>

    <!-- Атмосферное затемнение по углам -->
    <div class="screen-vignette"></div>

    <!-- Нижняя панель навигации -->
    <div class="nav-menu">
        <!-- Мужская сессия -->
        <div class="nav-item active" onclick="switchTab('session-male', this)">
            <div class="nav-avatar-wrapper">♂</div>
            <div class="nav-text">Сессия</div>
        </div>

        <!-- Женская сессия -->
        <div class="nav-item" onclick="switchTab('session-female', this)">
            <div class="nav-avatar-wrapper">♀</div>
            <div class="nav-text">Сессия</div>
        </div>

        <!-- Магазин -->
        <div class="nav-item" onclick="switchTab('shop', this)">
            <div class="nav-avatar-wrapper">🛍️</div>
            <div class="nav-text">Магазин</div>
        </div>

        <!-- Секс -->
        <div class="nav-item" onclick="switchTab('sex', this)">
            <div class="nav-avatar-wrapper">🔥</div>
            <div class="nav-text">Секс</div>
        </div>

        <!-- Шоп -->
        <div class="nav-item" onclick="switchTab('market', this)">
            <div class="nav-avatar-wrapper">🛒</div>
            <div class="nav-text">Шоп</div>
        </div>

        <!-- Подарки -->
        <div class="nav-item" onclick="switchTab('gifts', this)">
            <div class="nav-avatar-wrapper">🎁</div>
            <div class="nav-text">Подарки</div>
        </div>

        <!-- Баллы -->
        <div class="nav-item" onclick="switchTab('points', this)">
            <div class="nav-avatar-wrapper">💎</div>
            <div class="nav-text">Баллы</div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App SDK
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        // Запрос полноэкранного режима
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }

        // Отключение вертикальных свайпов (чтобы не сворачивало игру)
        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
        }

        // Синхронизация цвета шапки с темным стилем приложения
        tg.setHeaderColor('#0d0d0d');
        tg.setBackgroundColor('#0d0d0d');

        // Функция переключения вкладок в интерфейсе
        function switchTab(tabName, element) {
            // Убираем класс активности у всех элементов
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            // Добавляем текущему
            element.classList.add('active');

            console.log("Переключено на вкладку:", tabName);
            // Здесь можно вызвать логику переключения сцены в Phaser
        }
    </script>
</body>
</html>
