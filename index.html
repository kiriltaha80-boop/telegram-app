<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pact & Passion — Жребий & Монета</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0C0A10;
      color: #F5F3F7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      overflow: hidden;
      position: relative;
    }

    /* Фоновые неоновые пятна */
    .ambient-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .glow-1 { top: -80px; left: -80px; background: #E63956; }
    .glow-2 { bottom: -60px; right: -60px; background: #680E2B; }

    /* Главная карточка окна */
    .random-app-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 360px;
      min-height: 490px;
      background: rgba(20, 16, 28, 0.94);
      border: 1px solid rgba(230, 57, 86, 0.35);
      border-radius: 26px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 25px rgba(230, 57, 86, 0.15);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Общий холст для салюта, конфетти и серпантина на всё окно */
    #burst-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    .sub-screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 2;
    }

    .header-title {
      font-weight: 800;
      color: #FFFFFF;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(230, 57, 86, 0.6);
    }

    /* Переключатель режимов */
    .mode-switch-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(10, 8, 16, 0.65);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 18px;
      position: relative;
      z-index: 2;
    }

    .mode-tab-btn {
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #9A91A5;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .mode-tab-btn.active {
      background: linear-gradient(135deg, rgba(230, 57, 86, 0.9), rgba(160, 16, 53, 0.95));
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(230, 57, 86, 0.4);
    }

    .tab-section {
      display: none;
      flex-direction: column;
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .tab-section.active {
      display: flex;
    }

    /* ========================================================
       РЕЖИМ 1: КУВЫРОК ВВЕРХ-ВНИЗ (ПО ОСИ X)
       ======================================================== */
    .coin-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1200px;
      cursor: pointer;
      min-height: 340px;
    }

    .coin-shadow {
      width: 110px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      position: absolute;
      bottom: 50px;
      transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
      filter: blur(3px);
      pointer-events: none;
      z-index: 1;
    }

    .coin-trajectory-box {
      position: relative;
      width: 135px;
      height: 135px;
      transform-style: preserve-3d;
      margin-bottom: 25px;
      will-change: transform;
      z-index: 10;
    }

    .coin-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .coin-side {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.8);
    }

    .coin-front {
      transform: rotateX(0deg);
    }

    .coin-back {
      transform: rotateX(180deg);
    }

    .coin-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toss-flying .coin-trajectory-box {
      animation: coinFlyTrajectory 1.35s cubic-bezier(0.25, 0.85, 0.35, 1) forwards;
    }

    @keyframes coinFlyTrajectory {
      0% { transform: translateY(0) scale(1); }
      42% { transform: translateY(-210px) scale(1.15); }
      85% { transform: translateY(0) scale(1); }
      93% { transform: translateY(-12px) scale(1.02); }
      100% { transform: translateY(0) scale(1); }
    }

    .toss-flying .coin-shadow {
      animation: coinShadowFlight 1.35s cubic-bezier(0.25, 0.85, 0.35, 1) forwards;
    }

    @keyframes coinShadowFlight {
      0%, 100% { transform: scale(1); opacity: 0.9; filter: blur(3px); }
      42% { transform: scale(0.35); opacity: 0.2; filter: blur(8px); }
      85% { transform: scale(1.1); opacity: 0.95; filter: blur(2px); }
      93% { transform: scale(0.85); opacity: 0.7; }
    }

    /* ========================================================
       РЕЖИМ 2: РАНДОМАЙЗЕР ЧИСЕЛ
       ======================================================== */
    .number-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      padding: 10px 0;
    }

    .range-selector-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      background: rgba(10, 8, 16, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 14px;
    }

    .range-label {
      font-size: 11px;
      font-weight: 700;
      color: #9A91A5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .range-input {
      width: 80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(230, 57, 86, 0.45);
      border-radius: 10px;
      padding: 6px 10px;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }

    .quick-chips-row {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 14px;
    }

    .chip-btn {
      flex: 1;
      padding: 7px 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #c9c2d1;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      background: rgba(230, 57, 86, 0.25);
      border-color: #E63956;
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(230, 57, 86, 0.4);
    }

    .dice-display-box {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      background: radial-gradient(circle at 40% 40%, rgba(45, 20, 36, 0.9) 0%, rgba(15, 10, 20, 0.95) 100%);
      border: 1.5px solid rgba(230, 57, 86, 0.55);
      box-shadow: 0 0 22px rgba(230, 57, 86, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      color: #FFFFFF;
      margin: 10px auto;
      text-shadow: 0 0 18px rgba(230, 57, 86, 0.9);
      transition: transform 0.15s ease;
    }

    .result-status-lbl {
      font-size: 13px;
      font-weight: 800;
      color: #FFA3B5;
      min-height: 20px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .action-roll-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      color: #FFFFFF;
      background: linear-gradient(135deg, #E63956 0%, #a01035 100%);
      box-shadow: 0 4px 16px rgba(230, 57, 86, 0.45);
      transition: transform 0.15s ease;
    }

    .action-roll-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="random-app-card" id="app-card">
    
    <!-- Общий холст праздничных эффектов -->
    <canvas id="burst-canvas"></canvas>

    <div class="sub-screen-header">
      <div class="header-title">Судьба & Жребий</div>
      <span style="font-size: 16px;">✨</span>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="mode-switch-tabs">
      <button class="mode-tab-btn active" id="tab-btn-coin" onclick="switchMode('coin')">🪙 Монетка</button>
      <button class="mode-tab-btn" id="tab-btn-dice" onclick="switchMode('dice')">🎲 Число (1-N)</button>
    </div>

    <!-- 1. МОНЕТКА -->
    <div class="tab-section active" id="section-coin">
      <div class="coin-stage" id="coin-stage" onclick="tossCoin()">
        
        <div class="coin-trajectory-box">
          <div class="coin-3d" id="coin-3d">
            
            <!-- СТОРОНА 1: МУЖСКОЙ СИМВОЛ ♂ (МАРС) -->
            <div class="coin-side coin-front">
              <svg class="coin-svg" viewBox="0 0 200 200">
                <defs>
                  <radialGradient id="goldPlateM" cx="35%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#fff4b8"/>
                    <stop offset="25%" stop-color="#e8be56"/>
                    <stop offset="65%" stop-color="#ab7717"/>
                    <stop offset="100%" stop-color="#543700"/>
                  </radialGradient>
                  <linearGradient id="goldEdgeM" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffe699"/>
                    <stop offset="50%" stop-color="#805400"/>
                    <stop offset="100%" stop-color="#ffdc80"/>
                  </linearGradient>
                  <linearGradient id="marsShine" gradientUnits="userSpaceOnUse" x1="50" y1="150" x2="150" y2="50">
                    <stop offset="0%" stop-color="#3d2600"/>
                    <stop offset="40%" stop-color="#6e4600"/>
                    <stop offset="70%" stop-color="#ffea9f"/>
                    <stop offset="100%" stop-color="#ffffff"/>
                  </linearGradient>
                </defs>
                <circle cx="100" cy="100" r="98" fill="url(#goldPlateM)" stroke="url(#goldEdgeM)" stroke-width="4"/>
                <circle cx="100" cy="100" r="91" fill="none" stroke="#664300" stroke-width="2.5" stroke-dasharray="3.2 2"/>
                <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,245,190,0.5)" stroke-width="1.2"/>
                
                <g filter="drop-shadow(0 3px 4px rgba(0,0,0,0.65))">
                  <circle cx="88" cy="112" r="38" fill="none" stroke="url(#marsShine)" stroke-width="13" stroke-linecap="round"/>
                  <line x1="115" y1="85" x2="148" y2="52" stroke="url(#marsShine)" stroke-width="13" stroke-linecap="round"/>
                  <polyline points="120,52 148,52 148,80" fill="none" stroke="url(#marsShine)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <g fill="#fce69a" opacity="0.8">
                  <circle cx="38" cy="72" r="2.8"/><circle cx="48" cy="48" r="2.8"/>
                  <circle cx="72" cy="36" r="2.8"/><circle cx="152" cy="152" r="2.8"/>
                  <circle cx="164" cy="128" r="2.8"/><circle cx="128" cy="164" r="2.8"/>
                </g>
              </svg>
            </div>

            <!-- СТОРОНА 2: ЖЕНСКИЙ СИМВОЛ ♀ (ВЕНЕРА) -->
            <div class="coin-side coin-back">
              <svg class="coin-svg" viewBox="0 0 200 200">
                <defs>
                  <radialGradient id="goldPlateF" cx="35%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#fff4b8"/>
                    <stop offset="25%" stop-color="#e8be56"/>
                    <stop offset="65%" stop-color="#ab7717"/>
                    <stop offset="100%" stop-color="#543700"/>
                  </radialGradient>
                  <linearGradient id="goldEdgeF" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffe699"/>
                    <stop offset="50%" stop-color="#805400"/>
                    <stop offset="100%" stop-color="#ffdc80"/>
                  </linearGradient>
                  <linearGradient id="venusShine" gradientUnits="userSpaceOnUse" x1="100" y1="35" x2="100" y2="165">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="35%" stop-color="#ffea9f"/>
                    <stop offset="70%" stop-color="#6e4600"/>
                    <stop offset="100%" stop-color="#3d2600"/>
                  </linearGradient>
                </defs>
                <circle cx="100" cy="100" r="98" fill="url(#goldPlateF)" stroke="url(#goldEdgeF)" stroke-width="4"/>
                <circle cx="100" cy="100" r="91" fill="none" stroke="#664300" stroke-width="2.5" stroke-dasharray="3.2 2"/>
                <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,245,190,0.5)" stroke-width="1.2"/>
                
                <g filter="drop-shadow(0 3px 4px rgba(0,0,0,0.65))">
                  <path d="M 100,40 A 34,34 0 1,1 99.9,40 M 100,108 L 100,158 M 74,133 L 126,133"
                        fill="none"
                        stroke="url(#venusShine)"
                        stroke-width="13"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>
                </g>
                <g fill="#fce69a" opacity="0.8">
                  <circle cx="44" cy="120" r="2.8"/><circle cx="36" cy="94" r="2.8"/>
                  <circle cx="44" cy="68" r="2.8"/><circle cx="156" cy="120" r="2.8"/>
                  <circle cx="164" cy="94" r="2.8"/><circle cx="156" cy="68" r="2.8"/>
                </g>
              </svg>
            </div>

          </div>
        </div>

        <div class="coin-shadow" id="coin-shadow"></div>
      </div>
    </div>

    <!-- 2. РАНДОМАЙЗЕР ЧИСЕЛ -->
    <div class="tab-section" id="section-dice">
      <div class="number-stage">
        
        <div class="range-selector-row">
          <span class="range-label">Диапазон: от 1 до</span>
          <input type="number" id="dice-max-input" class="range-input" value="10" min="2" max="9999" onchange="syncPresetChips(this.value)">
        </div>

        <div class="quick-chips-row">
          <button class="chip-btn" onclick="setDiceMax(6, this)">до 6</button>
          <button class="chip-btn active" onclick="setDiceMax(10, this)">до 10</button>
          <button class="chip-btn" onclick="setDiceMax(20, this)">до 20</button>
          <button class="chip-btn" onclick="setDiceMax(50, this)">до 50</button>
          <button class="chip-btn" onclick="setDiceMax(100, this)">до 100</button>
        </div>

        <div class="dice-display-box" id="dice-display-num">?</div>
        <div class="result-status-lbl" id="dice-status-lbl">Задайте предел и испытайте жребий</div>

        <button class="action-roll-btn" onclick="rollRandomNumber()">Испытать судьбу</button>
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    function triggerHaptic(type) {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      } else if (navigator.vibrate) {
        if (type === 'light') navigator.vibrate(20);
        if (type === 'medium') navigator.vibrate(45);
        if (type === 'heavy') navigator.vibrate(85);
      }
    }

    function switchMode(mode) {
      triggerHaptic('light');
      document.querySelectorAll('.mode-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));

      if (mode === 'coin') {
        document.getElementById('tab-btn-coin').classList.add('active');
        document.getElementById('section-coin').classList.add('active');
      } else {
        document.getElementById('tab-btn-dice').classList.add('active');
        document.getElementById('section-dice').classList.add('active');
      }
    }

    // ==========================================
    // СИСТЕМА САЛЮТА, КОНФЕТТИ И СЕРПАНТИНА
    // ==========================================
    const canvas = document.getElementById('burst-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animId = null;

    function resizeCanvas() {
      const card = document.getElementById('app-card');
      if (card && canvas) {
        canvas.width = card.clientWidth;
        canvas.height = card.clientHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    // Запуск яркого праздника с лентами серпантина
    function launchCelebration(x, y) {
      resizeCanvas();
      particles = [];

      const originX = (x !== undefined) ? x : canvas.width / 2;
      const originY = (y !== undefined) ? y : canvas.height / 2;

      // Богатая палитра: золото, рубин, неон, циан, фиолетовый, изумруд
      const colors = [
        '#FFD700', '#FFB703', '#FFFFFF',
        '#E63956', '#FF1493', '#FF2A85',
        '#00F0FF', '#00D2FF', '#9B51E0',
        '#00E676', '#FF5722'
      ];

      // 1. Искры салюта (45 шт)
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8.5 + 4;
        particles.push({
          type: 'spark',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 2.5 + 1.2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.025 + 0.016,
          gravity: 0.14
        });
      }

      // 2. Порхающее конфетти (48 шт)
      for (let i = 0; i < 48; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6.5 + 3;
        particles.push({
          type: 'confetti',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3.2,
          w: Math.random() * 7 + 4.5,
          h: Math.random() * 4.5 + 2.8,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.28,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.014 + 0.008,
          gravity: 0.1
        });
      }

      // 3. Серпантин — длинные извивающиеся спиральные ленты (24 шт)
      for (let i = 0; i < 24; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5.5 + 2.5;
        particles.push({
          type: 'serpentine',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4.5,
          length: Math.random() * 26 + 22,
          width: Math.random() * 2.6 + 2.4,
          wave: Math.random() * Math.PI * 2,
          waveSpeed: Math.random() * 0.16 + 0.09,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.009 + 0.006,
          gravity: 0.08
        });
      }

      if (!animId) animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);

        if (p.type === 'spark') {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color;
          ctx.fill();
        } else if (p.type === 'confetti') {
          p.rot += p.vRot;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 4;
          ctx.shadowColor = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else if (p.type === 'serpentine') {
          p.wave += p.waveSpeed;
          ctx.translate(p.x, p.y);
          ctx.beginPath();
          const segments = 6;
          const segLen = p.length / segments;
          ctx.lineWidth = p.width;
          ctx.strokeStyle = p.color;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.shadowBlur = 6;
          ctx.shadowColor = p.color;

          for (let s = 0; s <= segments; s++) {
            const px = Math.sin(p.wave + s * 1.1) * (p.width * 2.8);
            const py = s * segLen;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        ctx.restore();
      }

      if (particles.length > 0) {
        animId = requestAnimationFrame(animateParticles);
      } else {
        cancelAnimationFrame(animId);
        animId = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // ==========================================
    // ЛОГИКА: КУВЫРОК ВВЕРХ-ВНИЗ (rotateX)
    // ==========================================
    let isTossing = false;
    let currentRotationX = 0;

    function tossCoin() {
      if (isTossing) return;
      isTossing = true;

      const stage = document.getElementById('coin-stage');
      const coin3D = document.getElementById('coin-3d');
      // true = Мужской (♂), false = Женский (♀)
      const isMale = Math.random() < 0.5;

      stage.classList.add('toss-flying');
      triggerHaptic('medium');

      const fullSpins = 360 * 6;
      currentRotationX += fullSpins + (isMale ? 0 : 180) - (currentRotationX % 360);

      coin3D.style.transition = 'transform 1.35s cubic-bezier(0.2, 0.85, 0.25, 1)';
      coin3D.style.transform = `rotateX(${currentRotationX}deg)`;

      setTimeout(() => triggerHaptic('light'), 300);
      setTimeout(() => triggerHaptic('light'), 650);

      // Приземление: мощный вибро-отклик + салют, конфетти и серпантин
      setTimeout(() => {
        triggerHaptic('heavy');
        
        // Запуск из центра экрана монеты
        const stageRect = stage.getBoundingClientRect();
        const cardRect = document.getElementById('app-card').getBoundingClientRect();
        const originX = (stageRect.left + stageRect.width / 2) - cardRect.left;
        const originY = (stageRect.top + stageRect.height / 2) - cardRect.top;

        launchCelebration(originX, originY);
        stage.classList.remove('toss-flying');
        isTossing = false;
      }, 1350);
    }

    // ==========================================
    // ЛОГИКА РАНДОМАЙЗЕРА ЧИСЕЛ
    // ==========================================
    let isRollingDice = false;

    function setDiceMax(val, btnEl) {
      const input = document.getElementById('dice-max-input');
      if (input) input.value = val;

      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      triggerHaptic('light');
    }

    function syncPresetChips(val) {
      const num = parseInt(val);
      document.querySelectorAll('.chip-btn').forEach(b => {
        const chipNum = parseInt(b.innerText.replace('до ', ''));
        b.classList.toggle('active', chipNum === num);
      });
    }

    function rollRandomNumber() {
      if (isRollingDice) return;

      const input = document.getElementById('dice-max-input');
      let max = parseInt(input?.value) || 10;
      if (max < 2) max = 2;
      if (input) input.value = max;

      isRollingDice = true;
      const display = document.getElementById('dice-display-num');
      const statusLbl = document.getElementById('dice-status-lbl');
      statusLbl.innerText = `Вращение от 1 до ${max}...`;

      let ticks = 0;
      const totalTicks = 18;

      const interval = setInterval(() => {
        const temp = Math.floor(Math.random() * max) + 1;
        if (display) {
          display.innerText = temp;
          display.style.transform = `scale(${1 + (ticks % 2 === 0 ? 0.08 : -0.04)})`;
        }
        triggerHaptic('light');
        ticks++;

        if (ticks >= totalTicks) {
          clearInterval(interval);
          const finalResult = Math.floor(Math.random() * max) + 1;
          if (display) {
            display.innerText = finalResult;
            display.style.transform = 'scale(1)';
          }
          statusLbl.innerText = `Выпало число: ${finalResult}`;
          triggerHaptic('success');
          
          // ЗАПУСК САЛЮТА, КОНФЕТТИ И СЕРПАНТИНА ДЛЯ РАНДОМАЙЗЕРА
          const dispRect = display.getBoundingClientRect();
          const cardRect = document.getElementById('app-card').getBoundingClientRect();
          const originX = (dispRect.left + dispRect.width / 2) - cardRect.left;
          const originY = (dispRect.top + dispRect.height / 2) - cardRect.top;
          launchCelebration(originX, originY);

          isRollingDice = false;
        }
      }, 65);
    }
  </script>
</body>
