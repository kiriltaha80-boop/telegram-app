<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pact & Passion</title>
  <!-- Подключение Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0C0A10;
      --card-bg: #16121E;
      --accent-ruby: #E63956;
      --accent-pink: #E8A0BF;
      --text-main: #F5EBE6;
      --text-muted: #A098AC;
      --border-color: rgba(232, 160, 191, 0.15);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: calc(env(safe-area-inset-top, 20px) + 120px);
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1E162B 0%, #0C0A10 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-title {
      font-size: 28px;
      letter-spacing: 4px;
      color: var(--accent-pink);
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 300;
    }

    .splash-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Главный контейнер */
    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Шапка с профилем и переключателем ролей */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .role-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px;
    }

    .role-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .role-btn.active {
      background: var(--accent-ruby);
      color: #FFF;
      box-shadow: 0 2px 10px rgba(230, 57, 86, 0.4);
    }

    /* Карточки */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent-pink);
    }

    /* Календарный блок */
    .calendar-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .cal-window {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    .cal-window-title {
      font-size: 12px;
      color: var(--accent-pink);
      margin-bottom: 6px;
    }

    /* Нижний Dock / Навигация */
    .dock {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      height: 60px;
      background: rgba(22, 18, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }

    .dock-item.active {
      color: var(--accent-pink);
    }

    .dock-icon {
      font-size: 20px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-title">Pact & Passion</div>
    <div class="splash-subtitle">Загрузка пространства...</div>
  </div>

  <!-- Главный Контент -->
  <div class="container">
    <header class="header">
      <div style="font-weight: 600; font-size: 18px;">Pact & Passion</div>
      <div class="role-switcher">
        <button class="role-btn active" id="btn-sub" onclick="setRole('sub')">Нижняя 😇</button>
        <button class="role-btn" id="btn-dom" onclick="setRole('dom')">Верхний 😈</button>
      </div>
    </header>

    <!-- Экран Нижней (😇) -->
    <main id="view-sub">
      <div class="card">
        <div class="card-title">Баланс очков трат</div>
        <div class="balance-value">1 250 PTS</div>
      </div>

      <div class="card">
        <div class="card-title">Женский Календарь</div>
        <div class="calendar-container">
          <div class="cal-window">
            <div class="cal-window-title">Фаза и статус</div>
            <div style="font-size: 14px;">Комфортный период</div>
          </div>
          <div class="cal-window">
            <div class="cal-window-title">Прогноз</div>
            <div style="font-size: 14px;">Следующий этап: через 8 дней</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Экран Верхнего (😈) -->
    <main id="view-dom" style="display: none;">
      <div class="card">
        <div class="card-title">Баланс очков заботы</div>
        <div class="balance-value">3 400 PTS</div>
      </div>

      <div class="card">
        <div class="card-title">Управление Контрактом</div>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">
          Все условия и правила взаимодействия активны.
        </p>
      </div>
    </main>
  </div>

  <!-- Нижний Dock -->
  <nav class="dock">
    <div class="dock-item active">
      <span class="dock-icon">👤</span>
      <span>Профиль</span>
    </div>
    <div class="dock-item">
      <span class="dock-icon">🏠</span>
      <span>Главная</span>
    </div>
    <div class="dock-item">
      <span class="dock-icon">💬</span>
      <span>Чат</span>
    </div>
  </nav>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;

    if (tg) {
      try {
        tg.ready();
        tg.expand();

        if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) {
          tg.requestFullscreen?.();
        }
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) {
          tg.disableVerticalSwipes?.();
        }
      } catch (e) {
        console.warn('Telegram WebApp init error:', e);
      }
    }

    // Скрытие Splash Screen после загрузки
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 800);
    });

    // Логика переключения ролей
    function setRole(role) {
      const btnSub = document.getElementById('btn-sub');
      const btnDom = document.getElementById('btn-dom');
      const viewSub = document.getElementById('view-sub');
      const viewDom = document.getElementById('view-dom');

      if (role === 'sub') {
        btnSub.classList.add('active');
        btnDom.classList.remove('active');
        viewSub.style.display = 'block';
        viewDom.style.display = 'none';
      } else {
        btnDom.classList.add('active');
        btnSub.classList.remove('active');
        viewDom.style.display = 'block';
        viewSub.style.display = 'none';
      }
    }
  </script>
</body>
</html>
