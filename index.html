<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pact & Passion — Рандомайзер</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0C0A10;
      color: #F5F3F7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 14px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновое рубиновое свечение */
    .ambient-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .glow-1 { top: -80px; left: -80px; background: #E63956; }
    .glow-2 { bottom: -60px; right: -60px; background: #680E2B; }

    .randomizer-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: rgba(22, 18, 30, 0.88);
      border: 1px solid rgba(230, 57, 86, 0.35);
      border-radius: 22px;
      padding: 20px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(230, 57, 86, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #FFA3B5;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(230, 57, 86, 0.6);
    }

    /* 3D МОНЕТКА */
    .coin-wrapper {
      width: 82px;
      height: 82px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.25s cubic-bezier(0.2, 0.8, 0.25, 1);
      margin: 8px auto;
    }

    .coin-side {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      backface-visibility: hidden;
      background: radial-gradient(circle at 35% 35%, #ffd277 0%, #b8861d 60%, #573a00 100%);
      border: 2.5px solid #ffe6a3;
      box-shadow: 0 0 24px rgba(230, 160, 57, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    }

    .coin-back {
      transform: rotateY(180deg);
    }

    /* ТАБЛО И НАСТРОЙКИ СЛУЧАЙНОГО ЧИСЛА */
    .dice-display-box {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      background: radial-gradient(circle at 40% 40%, rgba(45, 20, 36, 0.9) 0%, rgba(15, 10, 20, 0.95) 100%);
      border: 1.5px solid rgba(230, 57, 86, 0.55);
      box-shadow: 0 0 20px rgba(230, 57, 86, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: #FFFFFF;
      margin: 8px auto 12px auto;
      text-shadow: 0 0 16px rgba(230, 57, 86, 0.9);
      transition: transform 0.15s ease;
    }

    /* Блок управления диапазоном (до N) */
    .range-selector-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      background: rgba(10, 8, 16, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 12px;
    }

    .range-label {
      font-size: 11px;
      font-weight: 700;
      color: #9A91A5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .range-input {
      width: 76px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(230, 57, 86, 0.45);
      border-radius: 8px;
      padding: 6px 8px;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .range-input:focus {
      border-color: #E63956;
      box-shadow: 0 0 10px rgba(230, 57, 86, 0.5);
    }

    /* Быстрые кнопки-чипы */
    .quick-chips-row {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 12px;
      justify-content: center;
    }

    .chip-btn {
      flex: 1;
      padding: 6px 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #c9c2d1;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      background: rgba(230, 57, 86, 0.25);
      border-color: #E63956;
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(230, 57, 86, 0.4);
    }

    /* Текст результата и кнопка */
    .result-label {
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      min-height: 22px;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(230, 57, 86, 0.6);
    }

    .action-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      color: #FFFFFF;
      background: linear-gradient(135deg, #E63956 0%, #a01035 100%);
      box-shadow: 0 4px 16px rgba(230, 57, 86, 0.45);
      transition: transform 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="randomizer-wrapper">

    <!-- 1. ОРЁЛ ИЛИ РЕШКА -->
    <div class="card">
      <div class="section-title">🪙 Орёл или Решка</div>
      
      <div class="coin-wrapper" id="coin-element">
        <div class="coin-side coin-front">👑</div>
        <div class="coin-side coin-back">🦅</div>
      </div>
      
      <div class="result-label" id="coin-result-lbl">Сделайте бросок</div>
      <button class="action-btn" onclick="playCoinFlip()">Бросить монетку</button>
    </div>

    <!-- 2. СЛУЧАЙНОЕ ЧИСЛО 1 ДО N -->
    <div class="card">
      <div class="section-title">🎲 Случайное число</div>
      
      <!-- Поле ввода верхнего предела -->
      <div class="range-selector-row">
        <span class="range-label">Диапазон: от 1 до</span>
        <input type="number" id="max-limit-input" class="range-input" value="10" min="2" max="9999" onchange="syncPresetChips(this.value)">
      </div>

      <!-- Быстрые пресеты -->
      <div class="quick-chips-row">
        <button class="chip-btn" onclick="setMaxLimit(6, this)">до 6</button>
        <button class="chip-btn active" onclick="setMaxLimit(10, this)">до 10</button>
        <button class="chip-btn" onclick="setMaxLimit(20, this)">до 20</button>
        <button class="chip-btn" onclick="setMaxLimit(50, this)">до 50</button>
        <button class="chip-btn" onclick="setMaxLimit(100, this)">до 100</button>
      </div>

      <!-- Табло числа -->
      <div class="dice-display-box" id="dice-display">?</div>

      <div class="result-label" id="dice-result-lbl">Задайте число и бросьте</div>
      <button class="action-btn" id="btn-roll-dice" onclick="playRandomRoll()">Испытать судьбу</button>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    function triggerHaptic(type) {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      } else if (navigator.vibrate) {
        if (type === 'light') navigator.vibrate(20);
        if (type === 'medium') navigator.vibrate(50);
        if (type === 'heavy') navigator.vibrate(85);
      }
    }

    // ==========================================
    // ЛОГИКА 1: МОНЕТКА
    // ==========================================
    let isCoinFlipping = false;
    let coinRotation = 0;

    function playCoinFlip() {
      if (isCoinFlipping) return;
      isCoinFlipping = true;

      const coin = document.getElementById('coin-element');
      const label = document.getElementById('coin-result-lbl');
      const isHeads = Math.random() < 0.5;

      label.innerText = 'Монетка в воздухе...';
      triggerHaptic('medium');

      // 4 полных оборота + нужная сторона
      const extraRot = 360 * 4;
      coinRotation += extraRot + (isHeads ? 0 : 180);
      if (coin) coin.style.transform = `rotateY(${coinRotation}deg)`;

      setTimeout(() => {
        label.innerText = isHeads ? 'Выпала: РЕШКА 👑' : 'Выпал: ОРЁЛ 🦅';
        triggerHaptic('success');
        isCoinFlipping = false;
      }, 1300);
    }

    // ==========================================
    // ЛОГИКА 2: СЛУЧАЙНОЕ ЧИСЛО 1 ДО N
    // ==========================================
    let isRolling = false;

    function setMaxLimit(val, btnEl) {
      const input = document.getElementById('max-limit-input');
      if (input) input.value = val;

      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      triggerHaptic('light');
    }

    function syncPresetChips(val) {
      const numVal = parseInt(val);
      document.querySelectorAll('.chip-btn').forEach(b => {
        const chipVal = parseInt(b.innerText.replace('до ', ''));
        b.classList.toggle('active', chipVal === numVal);
      });
    }

    function playRandomRoll() {
      if (isRolling) return;

      const input = document.getElementById('max-limit-input');
      let max = parseInt(input?.value) || 10;
      if (max < 2) max = 2; // Минимальная граница для броска
      if (input) input.value = max;

      isRolling = true;
      const display = document.getElementById('dice-display');
      const label = document.getElementById('dice-result-lbl');
      label.innerText = `Выбираем из 1...${max}`;

      let ticks = 0;
      const totalTicks = 18; // Количество прокруток перед остановкой

      const interval = setInterval(() => {
        const temp = Math.floor(Math.random() * max) + 1;
        if (display) {
          display.innerText = temp;
          display.style.transform = `scale(${1 + (ticks % 2 === 0 ? 0.08 : -0.04)})`;
        }
        triggerHaptic('light');
        ticks++;

        if (ticks >= totalTicks) {
          clearInterval(interval);
          const finalResult = Math.floor(Math.random() * max) + 1;
          if (display) {
            display.innerText = finalResult;
            display.style.transform = 'scale(1)';
          }
          label.innerText = `Выпало: ${finalResult}`;
          triggerHaptic('success');
          isRolling = false;
        }
      }, 65);
    }
  </script>
</body>
</html>
