<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview: Флирт XOXO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 25%, #4a0d4a 0%, #220326 55%, #0b010d 100%);
      background-size: cover;
      background-attachment: fixed;
    }

    #wallpaper-particles {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-wp-item {
      position: absolute;
      bottom: -90px;
      user-select: none;
      pointer-events: none;
      animation: floatUpPuffyAnim linear infinite;
      will-change: transform, opacity;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes floatUpPuffyAnim {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(0.88);
        opacity: 0;
      }
      12% {
        opacity: var(--target-opacity, 0.75);
      }
      85% {
        opacity: var(--target-opacity, 0.75);
      }
      100% {
        transform: translate3d(var(--drift-x, 30px), -118vh, 0) rotate(var(--target-rot, 18deg)) scale(1.08);
        opacity: 0;
      }
    }

    .wp-puffy-heart {
      width: var(--size, 52px);
      height: var(--size, 52px);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55)) drop-shadow(0 2px 8px rgba(230, 57, 86, 0.35));
      transform: rotate(var(--tilt-angle, -6deg));
    }

    /* Пример имитации интерфейса */
    .mock-overlay {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #FFFFFF;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }
    .mock-capsule {
      padding: 10px 24px;
      background: rgba(28, 20, 36, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 999px;
      border: 1px solid rgba(230, 57, 86, 0.4);
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="wallpaper-particles"></div>

  <div class="mock-overlay">
    <div class="mock-capsule">Pact &amp; Passion • Тема: Флирт XOXO</div>
  </div>

  <script>
    const container = document.getElementById('wallpaper-particles');
    const palettes = [
      { top: '#ff6b95', mid: '#e62458', base: '#6b0821', highlight: '#ffffff' },
      { top: '#d946ef', mid: '#a21caf', base: '#4a044e', highlight: '#ffffff' },
      { top: '#be123c', mid: '#881337', base: '#3b0313', highlight: '#ffccd5' }
    ];

    const count = 16;

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'floating-wp-item';

      const leftPos = Math.random() * 92 + 4;
      const duration = Math.random() * 7 + 10; // 10–17 сек
      const delay = Math.random() * 12;
      const driftX = (Math.random() - 0.5) * 70;
      const targetRot = (Math.random() - 0.5) * 36;
      const tiltAngle = (Math.random() - 0.5) * 24;
      const targetOpacity = (Math.random() * 0.35 + 0.45).toFixed(2);
      const size = Math.floor(Math.random() * 26 + 34); // 34px - 60px

      el.style.left = `${leftPos}%`;
      el.style.animationDuration = `${duration}s`;
      el.style.animationDelay = `-${delay}s`;
      el.style.setProperty('--drift-x', `${driftX}px`);
      el.style.setProperty('--target-rot', `${targetRot}deg`);
      el.style.setProperty('--tilt-angle', `${tiltAngle}deg`);
      el.style.setProperty('--target-opacity', targetOpacity);
      el.style.setProperty('--size', `${size}px`);

      const pal = palettes[Math.floor(Math.random() * palettes.length)];
      const hasXoxo = (size > 40) && (Math.random() > 0.4);

      el.innerHTML = `
        <svg class="wp-puffy-heart" viewBox="0 0 48 48">
          <defs>
            <radialGradient id="bodyG-${i}" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="${pal.top}"/>
              <stop offset="45%" stop-color="${pal.mid}"/>
              <stop offset="100%" stop-color="${pal.base}"/>
            </radialGradient>
            <radialGradient id="highG-${i}" cx="35%" cy="25%" r="45%">
              <stop offset="0%" stop-color="${pal.highlight}" stop-opacity="0.8"/>
              <stop offset="60%" stop-color="${pal.highlight}" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="${pal.highlight}" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <path fill="url(#bodyG-${i})" d="M24 43S3 30 3 15C3 8 8.5 3 15 3c4.5 0 7.8 2.6 9 5.5C25.2 5.6 28.5 3 33 3c6.5 0 12 5 12 12 0 15-21 28-21 28z"/>
          <path fill="url(#highG-${i})" d="M24 43S3 30 3 15C3 8 8.5 3 15 3c4.5 0 7.8 2.6 9 5.5C25.2 5.6 28.5 3 33 3c6.5 0 12 5 12 12 0 15-21 28-21 28z"/>
          ${hasXoxo ? `
            <text x="24" y="27" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-weight="900" font-size="10" fill="rgba(255,255,255,0.85)" letter-spacing="1.5" transform="rotate(-12 24 25)">xoxo</text>
          ` : ''}
        </svg>
      `;

      container.appendChild(el);
    }
  </script>
</body>
</html>
